# Metadata and optional-dependency extras only.
# The runtime stays 100% stdlib; nothing here changes that.
# Accidental "pip install ." is safe: packages=[] means nothing gets packaged.

[project]
name = "noemaforge"
dynamic = ["version"]
description = "Local-first AI operating environment — privacy-first, artifact-driven"
requires-python = ">=3.11"
readme = "README.md"
license = {file = "LICENSE"}

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
]

# Dependencies required to collect and run the repository test suite.
# Keep this in sync with noemaforge/tests imports so target-host UAT can
# bootstrap from a clean venv with `python -m pip install -e ".[dev]"`.
dev = [
    "pytest",
    "pyyaml",
    "jsonschema",
]
# Optional import in noemaforge/src/vstore.py
vector = ["numpy"]
# Optional import in noemaforge/src/webgateway.py
gateway = ["httpx"]

[tool.setuptools]
# Explicitly empty — this repo is run from a checkout, not installed
packages = []

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
