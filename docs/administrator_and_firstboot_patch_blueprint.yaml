apiVersion: noemaforge.patchblueprint/v1
kind: AdministratorAndFirstBootPatch
version_target: 0.27.1

administrator:
  role_id: administrator
  stream_id: operator.admin
  duties:
    - interpret_user_request
    - select_mode_or_role
    - answer_from_knowledge_hypergraph
    - mutate_task_queue
    - explain_system_capabilities
  delegation:
    confidence_threshold: 0.70
    clarify_if_below_threshold: true
    allow_multi_role: true
  runtime_outputs:
    - answer
    - clarification
    - delegation_plan
    - task_receipt
    - capability_guide

firstboot:
  command: brainctl firstboot install-eval-apply
  required_args:
    - share_root
    - seed_root
    - vault_root
  phases:
    - prepare_paths
    - stage_seed
    - normalize_inbox
    - inventory_models_and_datasets
    - resolve_role_dataset_profiles
    - staff_roles_fast_pass
    - create_allowlisted_prestart_request
    - auto_approve_firstboot_request
    - build_epoch
    - apply_epoch
    - reboot
  progress_file: /var/lib/noemaforge/bootstrap/firstboot-status.json
  events_file: /var/lib/noemaforge/bootstrap/firstboot-events.jsonl
  reboot_required: true

staffing:
  strategy: first_passing_per_role
  if_no_passing_model: N/A
  if_dataset_missing: N/A
  continue_after_na: true
  roles_surface:
    include_all_declared_roles: true
    exclude_legacy_aliases_by_default: true
  thresholds:
    smoke_min_pass_rate: 0.80
    full_min_pass_rate: 0.65
    min_json_parse_rate: 0.90

role_eval_datasets:
  operator.admin/administrator:
    - admin_general
    - knowledge_ops
    - task_ops
  dev.work/solution_architect:
    - dev_architecture
    - dev_general
  dev.work/dev:
    - dev_patch
    - dev_python
    - dev_sql
  system.guard/surgeon:
    - policy_patch
    - prestart_discipline
  writing.story/writer.fiction:
    - library_fiction
  writing.story/writer.scipop:
    - library_scipop
  writing.story/writer.articles:
    - library_articles

auto_apply_guardrails:
  allow_only_on_pristine_install: true
  allowed_requested_changes:
    - role_model_policy_patch
    - llm_backends_policy_patch
    - team_model_policy_patch
    - administrator_policy_patch
    - role_eval_datasets_patch
  forbid_bundle_changes: true
  forbid_tool_registry_changes: true
  forbid_streams_changes: false
