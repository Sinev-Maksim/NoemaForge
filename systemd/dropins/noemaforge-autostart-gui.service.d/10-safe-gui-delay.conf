[Unit]
After=gdm.service gdm3.service display-manager.service graphical.target network-online.target
Wants=network-online.target

[Service]
# Delay after timer fire. Readiness probing is handled inside noemaforge-autostart-safe
# and is non-fatal in GUI mode; do not fail the boot because NVIDIA/GDM is late.
ExecStartPre=/bin/sleep 45
