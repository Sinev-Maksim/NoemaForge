[Service]
ExecStartPost=/bin/sh -c 'for i in $(seq 1 60); do if [ -S "/run/noemaforge/llm/backends/%i.sock" ]; then chown noemaforge:noemaforge "/run/noemaforge/llm/backends/%i.sock" 2>/dev/null || true; chmod 0770 "/run/noemaforge/llm/backends/%i.sock" 2>/dev/null || true; exit 0; fi; sleep 1; done; exit 0'
