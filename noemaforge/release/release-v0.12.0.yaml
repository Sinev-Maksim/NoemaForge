    - role-model-policy.yaml
    - model-eval-suite.yaml
    - llm-backends-policy.yaml
    - maintenance-policy.yaml
    - taskqueue-policy.yaml
    - flow-catalog.yaml
    - flow-eval-suite.yaml
    - team-eval-policy.yaml
    - team-model-policy.yaml
  services_added:
    - noemaforge-modelscan.timer
    - noemaforge-maintenance.timer
    - noemaforge-llm-backends-manager.timer
    - noemaforge-firstboot-eval.service
  notes:
    - "This is a full seed build (not a patch). Apply on top of a clean workspace or new disk installation." 
