# examples/environments/stable.yaml
# Production (stable) environment profile for NoemaForge.
# This is a DOCUMENTATION EXAMPLE for 0.32.2.
# Promotion path: dev -> stage -> stable. Stable requires full approval and a signed manifest.

apiVersion: noemaforge.environments/v1
kind: Environment
metadata:
  name: stable
  description: Production target-host environment (Debian Trixie / GNOME-GDM / RTX 3080 Ti).

spec:
  platform:
    display_policy: keep_display  # mandatory; GPU commands must never drop the display
    bind_admin_gui: "127.0.0.1:8765"

  model_profile: full_composite   # full evaluation + composite role planning
  auto_start_llm: false           # operator-initiated only
  approval_required: true         # every apply step needs explicit operator approval

  release_gate:
    require_signed_manifest: true       # no deploy without a verified release manifest
    require_premerge_gate_pass: true
    require_target_host_validation: true

  data_roots:
    # Resolved by platform_paths at runtime; shown here for documentation.
    sessions: "/var/lib/noemaforge/sessions"
    memory: "/var/lib/noemaforge/memory"
    artifacts: "/var/lib/noemaforge/artifacts"

  promote_to: null  # stable is the terminal environment
