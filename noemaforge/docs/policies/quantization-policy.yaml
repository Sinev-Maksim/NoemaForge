apiVersion: noemaforge.policy/v1
kind: QuantizationPolicy
version: 0.32.2
summary: Local GGUF model sizing policy for public MWP desktops.
runtime:
  runtime_desired_count: 1
  parallel_model_runtime: TODO requires explicit scheduler/resource guard
rules:
  default_quantization: Q4_K_M
  small_fast: Q5_K_M or Q8_0 for <=1B models
  large_economy: Q4_K_S
  avoid_default:
    - Q8_0 for 7B+
    - Q6_K for 7B+ unless headless and validated
    - 14B+ as always-on on 16GB RAM desktops
    - 32B+ as runtime-main on 16GB RAM desktops
  sharded_gguf:
    launchable:
      - single .gguf
      - 00001-of-N head shard
    forbidden:
      - 00002-of-N
      - 00003-of-N
      - any non-head shard
machine_tiers:
  tiny:
    ram_gib: '<8'
    recommendation: 0.3B-1.5B Q4_K_M/Q5_K_M; Q8_0 only <=1B
  small:
    ram_gib: '8-16'
    recommendation: 1.5B-3B Q4_K_M; 7B Q4_K_S tests only
  desktop_16gb:
    ram_gib: '16-32'
    recommendation: 3B Q4_K_M safe main; 7B/8B Q4_K_M tests; 14B headless/test only
  workstation_32gb:
    ram_gib: '32-64'
    recommendation: 7B/8B Q4_K_M/Q5_K_M main; 14B Q4_K_M tests
  large_workstation:
    ram_gib: '64+'
    recommendation: 14B Q4_K_M/Q5_K_M main candidates; 32B Q4_K_M test/headless
