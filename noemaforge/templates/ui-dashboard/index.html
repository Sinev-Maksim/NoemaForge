<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NoemaForge Dashboard</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="title">NoemaForge Dashboard</div>
      <div class="meta">
        <span id="statusDot" class="dot"></span>
        <span id="statusText">connecting…</span>
        <span class="sep">•</span>
        <span id="ts">–</span>
      </div>
    </header>

    <main class="grid">
      <section class="card" id="nowCard">
        <h2>Now</h2>
        <div class="kv" id="nowKv"></div>
      </section>

      <section class="card" id="tasksCard">
        <h2>TaskQueue</h2>
        <div class="sub" id="tqSummary"></div>
        <h3>Current</h3>
        <div class="mono" id="tqCurrent">–</div>
        <h3>Next</h3>
        <div class="table" id="tqNext">–</div>
      </section>


      <section class="card" id="inboxCard">
        <h2>Inbox</h2>
        <div class="sub" id="inboxSummary"></div>
        <div id="inboxBlocks">–</div>
      </section>

      <section class="card" id="projectsCard">
        <h2>Projects</h2>
        <div id="projectsList">–</div>
      </section>

      <section class="card" id="eventsCard">
        <h2>Recent events</h2>
        <div class="table" id="eventsTable">–</div>
      </section>

      <section class="card" id="telemetryCard">
        <h2>Telemetry</h2>
        <div class="table" id="telemetryTable">–</div>
      </section>
    </main>

    <footer class="footer">
      <span class="mono">/api/snapshot</span>
      <span class="sep">•</span>
      <span class="muted">Safe-by-default: no raw prompts are shown.</span>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
