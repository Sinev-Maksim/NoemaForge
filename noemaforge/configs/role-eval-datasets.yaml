apiVersion: noemaforge.roleeval/v1
kind: RoleEvalDatasets
defaults:
  suite: smoke
  cap: llm
  dataset_profile: internal_jsonl
  minimal_thresholds:
    pass_rate: 0.6
    json_parse_rate: 0.8
    quality_score: 0.55
profiles:
  internal_jsonl:
    type: seed_jsonl
    available_when:
    - path: /opt/noemaforge/datasets/role_eval_cases
      kind: dir
  administrator_core:
    type: seed_jsonl
    available_when:
    - path: /opt/noemaforge/datasets/role_eval_cases/administrator_smoke.jsonl
      kind: file
  writer_library:
    type: external_library
    available_when:
    - path: /var/lib/noemaforge/library
      kind: dir
      optional: true
    - path: /workspace/inbox/library
      kind: dir
      optional: true
  knowledge_graph:
    type: state_kg
    available_when:
    - path: /var/lib/noemaforge/kg
      kind: dir
      optional: true
  knowledge_bootstrap:
    type: seed_jsonl
    available_when:
    - path: /opt/noemaforge/datasets/role_eval_cases
      kind: dir
roles:
  operator.admin/administrator:
    suite: full
    dataset_profile: administrator_core
  system.guard/surgeon:
