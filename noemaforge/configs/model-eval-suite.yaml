apiVersion: noemaforge.eval/v1
kind: ModelEvalSuite
datasets:
  auto_load: true
  base_dir: datasets/role_eval_cases
  include_files: []
suites:
  smoke:
    desc: Minimal smoke tests per role (JSON structure + basic reasoning).
    cases:
      llm:
        default:
        - id: json_echo_v2
          messages:
          - role: system
            content: You are a helpful assistant. Return ONLY valid JSON.
          - role: user
            content: Return JSON with keys ok=true, echo='ping', count=1.
          expect:
            json: true
            keys:
            - ok
            - echo
            - count
        - id: json_math_v2
          messages:
          - role: system
            content: Return ONLY valid JSON.
          - role: user
            content: Compute 17*19. Return JSON {result:<int>, steps:<string>}
          expect:
            json: true
            keys:
            - result
            - steps
        - id: json_safety_v2
          messages:
          - role: system
            content: Return ONLY valid JSON.
          - role: user
            content: List 3 general safety rules for handling unknown files. Return
              JSON {rules:[...]}
          expect:
            json: true
            keys:
            - rules
        solution_architect:
        - id: arch_api_design_v1
          messages:
          - role: system
            content: You are a solution architect. Return ONLY JSON.
          - role: user
            content: 'Design a small REST API for ''Task Tracker''. Return JSON with
              keys: endpoints, data_model, auth, risks.'
          expect:
            json: true
            keys:
            - endpoints
            - data_model
            - auth
            - risks
        pm:
        - id: pm_scope_brief_v1
          messages:
          - role: system
            content: You are a product manager. Return ONLY JSON.
          - role: user
            content: Write a brief for a 'Task Tracker' MVP. Return JSON {problem,
              users, scope, non_goals, success_metrics}.
          expect:
            json: true
            keys:
            - problem
            - users
            - scope
            - non_goals
            - success_metrics
        dev:
        - id: dev_bugfix_plan_v1
          messages:
          - role: system
            content: You are a senior developer. Return ONLY JSON.
          - role: user
            content: Given a Python function that sometimes throws KeyError, propose
              a fix plan. Return JSON {root_cause, patch, tests}.
          expect:
            json: true
            keys:
            - root_cause
            - patch
            - tests
        reviewer:
        - id: reviewer_checklist_v1
          messages:
          - role: system
            content: You are a code reviewer. Return ONLY JSON.
          - role: user
            content: Create a PR review checklist for a backend service. Return JSON
              {checklist:[...], red_flags:[...]}
          expect:
            json: true
            keys:
            - checklist
            - red_flags
        qa:
        - id: qa_test_matrix_v1
          messages:
          - role: system
            content: You are a QA engineer. Return ONLY JSON.
          - role: user
            content: Make a small test matrix for login flow. Return JSON {smoke:[...],
              regression:[...], edge_cases:[...]}
          expect:
            json: true
            keys:
            - smoke
            - regression
            - edge_cases
        sysadmin:
        - id: sysadmin_runbook_v1
          messages:
          - role: system
            content: You are a sysadmin. Return ONLY JSON.
          - role: user
            content: Write a runbook outline for 'Disk full' incident. Return JSON
              {signals, triage_steps, mitigations}.
          expect:
            json: true
            keys:
            - signals
            - triage_steps
            - mitigations
        writer:
        - id: writer_logline_pack_v1
          messages:
          - role: system
            content: You are a fiction writer. Return ONLY JSON.
          - role: user
            content: Create a story seed. Return JSON {logline, setting, protagonist,
              antagonist, stakes}.
          expect:
            json: true
            keys:
            - logline
            - setting
            - protagonist
            - antagonist
            - stakes
        tropemaster:
        - id: tropemaster_trope_map_v1
          messages:
          - role: system
            content: You are a tropemaster. Return ONLY JSON.
          - role: user
            content: Suggest 5 fitting tropes for a cyber-noir detective story. Return
              JSON {tropes:[...], subversions:[...]}
          expect:
            json: true
            keys:
            - tropes
            - subversions
        world_keeper:
        - id: world_keeper_consistency_v1
          messages:
          - role: system
            content: You are the world keeper. Return ONLY JSON.
          - role: user
            content: Define 6 world rules for a hard-sci-fi setting. Return JSON {rules:[...],
              constraints:[...]}
          expect:
            json: true
            keys:
            - rules
            - constraints
        fact_checker:
        - id: fact_checker_claims_v1
          messages:
          - role: system
            content: You are a fact checker. Return ONLY JSON.
          - role: user
            content: Given the claim 'Vitamin C prevents colds', outline what you'd
              verify. Return JSON {claims:[...], sources:[...], cautions:[...]}
          expect:
            json: true
            keys:
            - claims
            - sources
            - cautions
        critic:
        - id: critic_feedback_v1
          messages:
          - role: system
            content: You are a literary critic. Return ONLY JSON.
          - role: user
            content: Give critique categories for a short story. Return JSON {strengths:[...],
              weaknesses:[...], questions:[...]}
          expect:
            json: true
            keys:
            - strengths
            - weaknesses
            - questions
        editor.literary:
        - id: editor_literary_edit_plan_v1
          messages:
          - role: system
            content: You are a literary editor. Return ONLY JSON.
          - role: user
            content: Draft an editing plan for a 2k-word scene. Return JSON {goals,
              line_edits, structural_notes}.
          expect:
            json: true
            keys:
            - goals
            - line_edits
            - structural_notes
        formatter:
        - id: formatter_style_guide_v1
          messages:
          - role: system
            content: You are a formatter. Return ONLY JSON.
          - role: user
            content: Create a markdown style guide snippet. Return JSON {rules:[...],
              examples:[...]}
          expect:
            json: true
            keys:
            - rules
            - examples
        python_dev:
        - id: python_dev_patch_v1
          messages:
          - role: system
            content: You are a Python developer. Return ONLY JSON.
          - role: user
            content: Propose a patch plan for a failing unit test in a Python service.
              Return JSON {root_cause, patch_steps, tests}.
          expect:
            json: true
            keys:
            - root_cause
            - patch_steps
            - tests
        sql_dev:
        - id: sql_dev_query_v1
          messages:
          - role: system
            content: You are a SQL developer. Return ONLY JSON.
          - role: user
            content: Design a safe migration for adding an index to a hot table. Return
              JSON {migration, rollback, verification}.
          expect:
            json: true
            keys:
            - migration
            - rollback
            - verification
  full:
    desc: Extended tests with dataset-driven expansion coverage.
    cases:
      llm:
        default:
        - id: json_longform_v1
          messages:
          - role: system
            content: Return ONLY JSON.
          - role: user
            content: Write a compact plan for learning a new skill in 30 days. Return
              JSON {week1, week2, week3, week4}.
          expect:
            json: true
            keys:
            - week1
            - week2
            - week3
            - week4
