    optional_capabilities: [audio_transcription]
    eval_pack: asr_light_10
  voice.speaker:
    top_k: 8
    required_capabilities: [tts]
    optional_capabilities: [voice_clone]
    eval_pack: tts_light_10
  vision.segmenter:
    top_k: 8
    required_capabilities: [vision, segmentation]
    optional_capabilities: []
    eval_pack: vision_light_10
  video.generator:
    top_k: 8
    required_capabilities: [video_generation]
    optional_capabilities: [image_to_video]
    eval_pack: video_light_10
  selfdev.learning/coach:
