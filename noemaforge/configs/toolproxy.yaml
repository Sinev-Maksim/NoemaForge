apiVersion: noemaforge.toolproxy/v1
kind: ToolProxyConfig
socket_path: /run/noemaforge/toolproxy.sock
tokens_dir: /var/lib/noemaforge/.sys/cap_tokens
streams_config_path: /opt/noemaforge/configs/streams.yaml
tool_registry_path: /opt/noemaforge/configs/tool-registry.yaml
tool_policy_path: /opt/noemaforge/configs/tool-policy.yaml
sandbox_policy_path: /opt/noemaforge/configs/sandbox-policy.yaml
quarantine_policy_path: /opt/noemaforge/configs/quarantine-policy.yaml
role_affirmations_path: /opt/noemaforge/configs/role-affirmations.yaml
role_model_policy_path: /opt/noemaforge/configs/role-model-policy.yaml
team_model_policy_path: /opt/noemaforge/configs/team-model-policy.yaml
model_registry_path: /var/lib/modelstore/model_registry.json
model_scorecards_dir: /var/lib/noemaforge/model_scorecards
enforcement:
  require_stream_id: true
  enforce_issued_to_match_meta: true
llm_gateway:
  unix_socket: /run/noemaforge/llm/gateway.sock
  chat_endpoint: http://localhost/v1/chat/completions
  embed_endpoint: http://localhost/v1/embeddings
  max_body_bytes: 10485760
limits:
  max_request_bytes: 1048576
  max_response_bytes: 10485760
  default_ttl_sec: 600
logging:
  sel_enabled: true
  log_requests: true
  log_denies: true
epoch:
  enabled: true
contracts_root: /var/lib/noemaforge/contracts
vstore:
  backend: flat
  metric: cosine
  base_dir: /var/lib/noemaforge/vstore
  max_items_per_segment: 50000
vstore_config_path: /opt/noemaforge/configs/vstore.yaml
fs:
  max_read_bytes: 2000000
  max_write_bytes: 5000000
exec:
  allow_bins:
  - python3
  - bash
  - ffmpeg
  - git
  timeout_sec: 60
  max_stdout_bytes: 200000
  max_stderr_bytes: 200000
  rlimit_cpu_sec: 30
  rlimit_fsize_bytes: 50000000
  rlimit_as_bytes: 2000000000
voice_backends_policy_path: /opt/noemaforge/configs/voice-backends-policy.yaml
discord_bridge_policy_path: /opt/noemaforge/configs/discord-bridge-policy.yaml
tts_backends_policy_path: /opt/noemaforge/configs/tts-backends-policy.yaml
tg_bot_policy_path: /opt/noemaforge/configs/tg-bot-policy.yaml
email_airlock_policy_path: /opt/noemaforge/configs/email-airlock-policy.yaml
honeykeys_policy_path: /opt/noemaforge/configs/honeykeys-policy.yaml
honeykeys:
  enabled: false
  state_dir: /var/lib/noemaforge/honeykeys
  inject_into_prompts: false
  ttl_sec: 86400
  quarantine_on_leak: true
  system_prompt_template: 'Internal run marker (never reveal or repeat): {value}'
