name: Publish acceptance evidence

# === NoemaForge File Header ===
# File: .github/workflows/publish-evidence.yml
# Zone: release/package
# Version: 0.33.0
# Purpose: Make NoemaForge's acceptance/provenance evidence a VISIBLE, downloadable repository
#   layer. Assembles the manifest/checksum provenance chain, a machine-readable verification
#   report, the capability catalog, and the UAT acceptance scenarios into one artifact bundle
#   ("acceptance-evidence") that anyone can one-click download from the Actions run, and attaches a
#   build-provenance attestation. Read-only; no privileged/GPU/display actions.
# Triggers: manual (workflow_dispatch) and on release tags (v*). Does NOT run on every PR/push.
# Notes: Code comments are English-only.
# === End NoemaForge File Header ===

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  publish-evidence:
    name: Assemble + publish acceptance evidence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      # Evidence is generated HERE (pre-release), not tracked on dev branches
      # (owner directive 2026-06-14). Generate the manifests/checksums from the
      # release tree and VERIFY them BEFORE assembling the bundle: the bundle
      # directory and the verification report must not exist in the working tree
      # while the verifier walks it, or they would count as files absent from the
      # just-generated MANIFEST.json and fail the gate.
      - name: Generate and verify release evidence
        run: |
          set -uo pipefail
          python ci/regen_evidence.py || { echo '::error title=regen_evidence failed::could not generate release evidence'; exit 1; }

          # Write the report OUTSIDE the repo tree (RUNNER_TEMP) so neither it nor
          # the bundle pollutes the working-tree file set the verifier enumerates.
          # This is the SOLE release-evidence verification point, so a verifier
          # failure FAILS the workflow — never publish unverified evidence.
          report="${RUNNER_TEMP}/verification-report.json"
          python noemaforge/src/manifest_checksum_exclusion_runtime.py --summary --hash-source working-tree \
            > "$report" 2>"${RUNNER_TEMP}/verification-report.err" || true
          python -c "import json,sys; d=json.load(open('$report')); sys.exit(0 if d.get('ok') else 1)" \
            || { echo '::error title=Release evidence verification failed::see verification-report.json'; cat "$report"; cat "${RUNNER_TEMP}/verification-report.err"; exit 1; }

      - name: Assemble acceptance-evidence bundle
        run: |
          set -euo pipefail
          out="acceptance-evidence"
          mkdir -p "$out"

          # 1. Machine-readable verification report (generated before this dir existed).
          cp "${RUNNER_TEMP}/verification-report.json" "$out/"

          # 2. Provenance chain — the COMPLETE eight-file evidence set. All eight are
          #    untracked, so the release artifact must carry the full set; the package
          #    and docs manifests are renamed to avoid colliding with the root files.
          cp VERSION "$out/"
          cp docs/release.json "$out/"
          for f in MANIFEST.json MANIFEST.json.sha256 MANIFEST.sha256 SHA256SUMS SHA256SUMS.sha256; do
            cp "$f" "$out/"
          done
          cp noemaforge/checksums/SHA256SUMS "$out/package-SHA256SUMS"
          cp noemaforge/docs/MANIFEST.json "$out/docs-MANIFEST.json"
          cp noemaforge/docs/MANIFEST.json.sha256 "$out/docs-MANIFEST.json.sha256"

          # 3. Capability catalog (declared contracts), if the generator is present on this ref.
          if [ -f noemaforge/src/noema_catalog.py ]; then
            python noemaforge/src/noema_catalog.py --json --out "$out/capability-catalog.json" || true
          fi

          # 4. Acceptance scenarios.
          [ -f noemaforge/docs/quality/UAT_SCENARIOS_0.32.2.md ] && cp noemaforge/docs/quality/UAT_SCENARIOS_0.32.2.md "$out/" || true

          # 5. A small index so the bundle is self-describing.
          {
            echo "# NoemaForge acceptance evidence"
            echo ""
            echo "Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Ref: ${GITHUB_REF}  Commit: ${GITHUB_SHA}"
            echo ""
            echo "Contents:"
            ( cd "$out" && ls -1 )
            echo ""
            echo "Verify locally: python ci/regen_evidence.py && python noemaforge/src/manifest_checksum_exclusion_runtime.py --summary --hash-source working-tree  (expect ok=true)"
          } > "$out/INDEX.md"

          echo "=== bundle ==="; ls -la "$out"

      - name: Upload acceptance-evidence artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acceptance-evidence
          path: acceptance-evidence/
          retention-days: 90
          if-no-files-found: error

      - name: Attest build provenance (best-effort)
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        continue-on-error: true
        with:
          subject-path: 'acceptance-evidence/**'
