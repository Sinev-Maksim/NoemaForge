name: Autonomous Dev Pipeline

on:
  push:
    branches:
      - 'claude/**'
      - 'codex/**'

jobs:
  # ─── Stage 1: lint + compile on Claude push ───────────────────────────────
  validate-claude-push:
    if: github.actor == 'Sinev-Maksim' && startsWith(github.ref, 'refs/heads/claude/')
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.info.outputs.branch }}
      changed_count: ${{ steps.info.outputs.changed_count }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install pyyaml --quiet

      - name: Get branch info and changed files
        id: info
        run: |
          set -euo pipefail
          base_branch="release/0.32.2-hardening"
          changed_file_list="$RUNNER_TEMP/changed_files.txt"

          git fetch --no-tags --depth=1 origin "$base_branch"
          git diff --name-only --diff-filter=ACMR "origin/$base_branch" HEAD > "$changed_file_list"

          echo "branch=${GITHUB_REF#refs/heads/}" >> "$GITHUB_OUTPUT"
          echo "changed_count=$(wc -l < "$changed_file_list" | tr -d ' ')" >> "$GITHUB_OUTPUT"

          echo "Changed files against $base_branch:"
          if [ -s "$changed_file_list" ]; then
            sed 's/^/- /' "$changed_file_list"
          else
            echo "- none"
          fi

      - name: Python compile check
        run: |
          python - <<'EOF'
          from pathlib import Path
          import os
          import py_compile
          import sys

          changed_file_list = Path(os.environ['RUNNER_TEMP']) / 'changed_files.txt'
          changed = [Path(line.strip()) for line in changed_file_list.read_text().splitlines() if line.strip()]
          files = [p for p in changed if p.suffix == '.py' and p.exists()]
          errors = []
          for path in files:
              try:
                  py_compile.compile(str(path), doraise=True)
              except Exception as exc:
                  errors.append(f"{path}: {exc}")
          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          print(f"PASS: python compile ({len(files)} changed files)")
          EOF

      - name: JSON parse check
        run: |
          python - <<'EOF'
          from pathlib import Path
          import json
          import os
          import sys

          changed_file_list = Path(os.environ['RUNNER_TEMP']) / 'changed_files.txt'
          files = [Path(line.strip()) for line in changed_file_list.read_text().splitlines() if line.strip()]
          files = [p for p in files if p.suffix == '.json' and p.exists()]
          errors = []
          for path in files:
              try:
                  json.loads(path.read_text(encoding='utf-8'))
              except Exception as exc:
                  errors.append(f"{path}: {exc}")
          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          print(f"PASS: json parse ({len(files)} changed files)")
          EOF

      - name: YAML parse check
        run: |
          python - <<'EOF'
          from pathlib import Path
          import os
          import sys
          import yaml

          changed_file_list = Path(os.environ['RUNNER_TEMP']) / 'changed_files.txt'
          changed = [Path(line.strip()) for line in changed_file_list.read_text().splitlines() if line.strip()]
          files = [p for p in changed if p.suffix in {'.yaml', '.yml'} and p.exists()]
          errors = []
          for path in files:
              try:
                  yaml.safe_load(path.read_text(encoding='utf-8'))
              except Exception as exc:
                  errors.append(f"{path}: {exc}")
          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          print(f"PASS: yaml parse ({len(files)} changed files)")
          EOF

      - name: Version check — no forbidden RUNTIME_VERSION assignment
        run: |
          python - <<'EOF'
          from pathlib import Path
          import os
          import re
          import sys

          allowed = Path('noemaforge/src/noemaforge_version.py')
          changed_file_list = Path(os.environ['RUNNER_TEMP']) / 'changed_files.txt'
          files = [Path(line.strip()) for line in changed_file_list.read_text().splitlines() if line.strip()]
          # Skip test files — assertIn(f'RUNTIME_VERSION = "..."') is a valid test assertion
          files = [p for p in files if p.suffix == '.py' and p.exists() and p != allowed
                   and 'tests' not in p.parts and 'test_' not in p.name]
          pattern = re.compile(r'(?m)^[ \t]*RUNTIME_VERSION[ \t]*=')
          hits = []
          for path in files:
              for line_no, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                  if pattern.match(line):
                      hits.append(f"{path}:{line_no}:{line}")
          if hits:
              print("FAIL: forbidden RUNTIME_VERSION assignment:")
              print('\n'.join(hits))
              sys.exit(1)
          print("PASS: no forbidden RUNTIME_VERSION assignment in changed files")
          EOF

      - name: VERSION files = 0.32.2
        run: |
          python - <<'EOF'
          from pathlib import Path
          import os
          import sys

          expected = '0.32.2'
          version_files = {Path('VERSION'), Path('noemaforge/VERSION'), Path('docs/VERSION')}
          changed_file_list = Path(os.environ['RUNNER_TEMP']) / 'changed_files.txt'
          changed = [Path(line.strip()) for line in changed_file_list.read_text().splitlines() if line.strip()]
          files = [p for p in changed if p in version_files and p.exists()]
          errors = []
          for path in files:
              value = path.read_text(encoding='utf-8').strip()
              if value != expected:
                  errors.append(f"{path} contains {value!r}, expected {expected!r}")
          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          print(f"PASS: VERSION files ({len(files)} changed files)")
          EOF

      - name: No __pycache__ in git
        run: |
          if grep -q '__pycache__' "$RUNNER_TEMP/changed_files.txt"; then
            echo "FAIL: __pycache__ present in changed files:"
            grep '__pycache__' "$RUNNER_TEMP/changed_files.txt"
            exit 1
          fi
          echo "PASS: no __pycache__ in changed files"

  # ─── Stage 2: Codex review (self-hosted Windows Codex CLI) ────────────────
  codex-review:
    needs: validate-claude-push
    if: github.actor == 'Sinev-Maksim'
    runs-on: [self-hosted, Windows, codex]
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Prepare source archive
        shell: pwsh
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'codex-source.zip'
          $extract = Join-Path $env:RUNNER_TEMP 'codex-source-extract'
          $worktree = Join-Path $env:RUNNER_TEMP 'codex-source'
          $archiveUrl = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/zipball/$env:GITHUB_SHA"

          $headers = @{
            Accept = 'application/vnd.github+json'
            'User-Agent' = 'NoemaForge-CI'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          if ($env:GITHUB_TOKEN) {
            $headers.Authorization = "Bearer $env:GITHUB_TOKEN"
          }

          if (Test-Path -LiteralPath $archive) {
            Remove-Item -LiteralPath $archive -Force
          }
          if (Test-Path -LiteralPath $extract) {
            Remove-Item -LiteralPath $extract -Recurse -Force
          }
          if (Test-Path -LiteralPath $worktree) {
            Remove-Item -LiteralPath $worktree -Recurse -Force
          }

          Invoke-WebRequest -Uri $archiveUrl -Headers $headers -OutFile $archive -MaximumRedirection 5
          Expand-Archive -LiteralPath $archive -DestinationPath $extract -Force

          $sourceRoot = Get-ChildItem -LiteralPath $extract -Directory | Select-Object -First 1
          if (-not $sourceRoot) {
            throw "No source directory found in GitHub archive."
          }

          # Self-hosted RUNNER_TEMP is not reliably emptied between jobs, and
          # Remove-Item -Recurse can leave a stale codex-source tree behind. If
          # $worktree still exists, Move-Item NESTS the repo under
          # $worktree\<owner-repo-sha>\, so .codex\instructions.md is missing from
          # the worktree root and every Codex review SKIPs. Force a clean rename.
          if (Test-Path -LiteralPath $worktree) {
            Remove-Item -LiteralPath $worktree -Recurse -Force -ErrorAction SilentlyContinue
          }
          if (Test-Path -LiteralPath $worktree) {
            $worktree = Join-Path $env:RUNNER_TEMP ("codex-source-" + [Guid]::NewGuid().ToString('N').Substring(0, 8))
          }
          Move-Item -LiteralPath $sourceRoot.FullName -Destination $worktree

          # --- TEMP DIAGNOSTIC: report extracted worktree contents -------------
          Write-Host "DIAG archive_bytes=$((Get-Item -LiteralPath $archive).Length) sourceRoot=$($sourceRoot.Name)"
          Write-Host "DIAG worktree=$worktree"
          Write-Host "DIAG worktree_top_level:"
          Get-ChildItem -Force -LiteralPath $worktree | ForEach-Object { Write-Host ("DIAG   [" + $_.Mode + "] " + $_.Name) }
          Write-Host ("DIAG codex_dir_exists=" + (Test-Path -LiteralPath (Join-Path $worktree '.codex')) + " instructions_exists=" + (Test-Path -LiteralPath (Join-Path $worktree '.codex\instructions.md')))
          Get-ChildItem -Force -LiteralPath (Join-Path $worktree '.codex') -ErrorAction SilentlyContinue | ForEach-Object { Write-Host ("DIAG   .codex/" + $_.Name) }
          # --- END TEMP DIAGNOSTIC ---------------------------------------------

          "CODEX_WORKTREE=$worktree" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Prepared source at $worktree"

      - name: Get diff vs release branch
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location -LiteralPath $env:CODEX_WORKTREE

          $base = [System.Uri]::EscapeDataString('release/0.32.2-hardening')
          $head = [System.Uri]::EscapeDataString($env:GITHUB_SHA)
          $diffPath = Join-Path $env:CODEX_WORKTREE 'diff.patch'
          $compareUrl = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/compare/$base...$head"
          $headers = @{
            Accept = 'application/vnd.github.diff'
            'User-Agent' = 'NoemaForge-CI'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          if ($env:GITHUB_TOKEN) {
            $headers.Authorization = "Bearer $env:GITHUB_TOKEN"
          }

          Invoke-WebRequest -Uri $compareUrl -Headers $headers -OutFile $diffPath
          $diff = Get-Item -LiteralPath $diffPath
          Write-Host "Downloaded diff.patch ($($diff.Length) bytes)"

      - name: Run Codex CLI review
        id: codex
        shell: pwsh
        timeout-minutes: 30
        env:
          CODEX_HOME: C:\Users\sinev\.codex
          CODEX_BIN_ROOT: C:\Users\sinev\AppData\Local\OpenAI\Codex\bin
        run: |
          $ErrorActionPreference = 'Continue'   # Allow non-terminating errors; we control exit.

          # Define paths first, before any Set-Location, so Write-SkipReview is always callable.
          $reviewPath = Join-Path $env:GITHUB_WORKSPACE 'codex_review.md'
          $logPath = Join-Path $env:RUNNER_TEMP 'codex_run.log'
          $codex = $null

          # Write-SkipReview: infra issues (binary/auth missing) → Verdict: SKIP, exit 0.
          # Only Verdict: FAIL (code issues caught by Codex) causes the job to fail.
          function Write-SkipReview([string] $reason) {
            $body = @(
              "Verdict: SKIP"
              ""
              "## Summary"
              "Codex CLI review was skipped due to a runner infrastructure issue."
              ""
              "**Reason:** $reason"
              ""
              "Code quality was validated by CodeQL, py_compile, and the Quality gate instead."
              "Fix the runner setup to enable Codex review: install codex.exe and run ``codex login``."
            ) -join [Environment]::NewLine
            [System.IO.File]::WriteAllText($reviewPath, $body, [System.Text.Encoding]::UTF8)
            Write-Warning "Codex CLI review SKIPPED: $reason"
          }

          # Verify CODEX_WORKTREE is set and exists before trying to use it.
          if (-not $env:CODEX_WORKTREE -or -not (Test-Path -LiteralPath $env:CODEX_WORKTREE)) {
            Write-SkipReview "CODEX_WORKTREE env var is missing or directory does not exist: '$env:CODEX_WORKTREE'."
            exit 0
          }
          Set-Location -LiteralPath $env:CODEX_WORKTREE

          function Write-FailureReview([string] $message) {
            $failureReview = @(
              "Verdict: ERROR"
              ""
              "**Reason:** $reason"
              ""
              "Code quality was validated by CodeQL, py_compile, and the Quality gate instead."
              "Fix the runner setup to enable Codex review: install codex.exe and run ``codex login``."
            ) -join [Environment]::NewLine
            [System.IO.File]::WriteAllText($reviewPath, $body, [System.Text.Encoding]::UTF8)
            Write-Warning "Codex CLI review SKIPPED: $reason"
          }

          # Verify CODEX_WORKTREE is set and exists before trying to use it.
          if (-not $env:CODEX_WORKTREE -or -not (Test-Path -LiteralPath $env:CODEX_WORKTREE)) {
            Write-SkipReview "CODEX_WORKTREE env var is missing or directory does not exist: '$env:CODEX_WORKTREE'."
            exit 0
          }
          Set-Location -LiteralPath $env:CODEX_WORKTREE

          # DIAG2: is the file still present at the start of the review step?
          Write-Host ("DIAG2 review_start instructions=" + (Test-Path -LiteralPath (Join-Path $env:CODEX_WORKTREE '.codex\instructions.md')))

          # Read review inputs BEFORE invoking the Codex CLI. Running `codex` with
          # the worktree as the working directory resets the worktree's .codex/
          # directory (the CLI treats .codex/ as its own project config dir), which
          # deletes .codex/instructions.md and forced a spurious SKIP even though
          # prepare had materialized the file correctly.
          $instructionsPath = Join-Path $env:CODEX_WORKTREE '.codex\instructions.md'
          $diffPath = Join-Path $env:CODEX_WORKTREE 'diff.patch'
          if (-not (Test-Path -LiteralPath $instructionsPath)) {
            Write-SkipReview ".codex/instructions.md was not found in the prepared source archive."
            exit 0
          }
          if (-not (Test-Path -LiteralPath $diffPath)) {
            Write-SkipReview "diff.patch was not found in the prepared source archive."
            exit 0
          }
          $instructions = Get-Content -LiteralPath $instructionsPath -Raw
          $diffText = Get-Content -LiteralPath $diffPath -Raw

          $pathCommand = Get-Command codex -ErrorAction SilentlyContinue
          if ($pathCommand) {
            $codex = $pathCommand.Source
          }

          if (-not $codex -and (Test-Path -LiteralPath $env:CODEX_BIN_ROOT)) {
            $codex = Get-ChildItem -LiteralPath $env:CODEX_BIN_ROOT -Filter codex.exe -Recurse -File |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 1 -ExpandProperty FullName
          }

          if (-not $codex -or -not (Test-Path -LiteralPath $codex)) {
            Write-SkipReview "codex.exe was not found. Add Codex CLI to PATH or set CODEX_BIN_ROOT."
            exit 0
          }

          $authPath = Join-Path $env:CODEX_HOME 'auth.json'
          if (-not (Test-Path -LiteralPath $authPath)) {
            Write-SkipReview "Codex ChatGPT OAuth auth.json not found at $authPath. Run: codex login."
            exit 0
          }

          & $codex login status 2>&1 | Out-Null
          $loginStatus = $LASTEXITCODE
          # DIAG2: did invoking the Codex CLI remove the worktree's .codex file?
          Write-Host ("DIAG2 after_login instructions=" + (Test-Path -LiteralPath $instructionsPath))
          if ($loginStatus -ne 0) {
            Write-SkipReview "Codex CLI is not logged in. Run: codex login (CODEX_HOME=$env:CODEX_HOME)."
            exit 0
          }
          $maxDiffChars = 120000
          if ($diffText.Length -gt $maxDiffChars) {
            $diffText = $diffText.Substring(0, $maxDiffChars) + [Environment]::NewLine + "[diff.patch truncated by workflow after $maxDiffChars characters]"
          }

          $prompt = @(
            "You are reviewing a Claude Code branch in NoemaForge."
            "Base branch: origin/release/0.32.2-hardening"
            "Head branch: $env:GITHUB_REF_NAME"
            "Commit: $env:GITHUB_SHA"
            ""
            "Review strictly against the gates from .codex/instructions.md included below."
            "Inspect the branch changes from diff.patch included below."
            "If local command execution is unavailable, use the inline content below and the GitHub connector as read-only fallback."
            "Return a concise GitHub-ready Markdown review."
            "Start with exactly one verdict line:"
            "Verdict: PASS"
            "or"
            "Verdict: FAIL"
            ""
            "Include sections for Summary, Blocking Issues, and Optimizations."
            "Do not modify files or push commits in this workflow run."
            "Use read-only inspection only."
            ""
            "Review gates from .codex/instructions.md:"
            '```markdown'
            $instructions
            '```'
            ""
            "Branch diff from release/0.32.2-hardening to $env:GITHUB_SHA:"
            '```diff'
            $diffText
            '```'
          ) -join [Environment]::NewLine

          & $codex exec `
            -s read-only `
            --output-last-message $reviewPath `
            $prompt 2>&1 | Tee-Object -FilePath $logPath

          if ($LASTEXITCODE -ne 0) {
            # Codex exec itself failed — treat as infra skip (not a code FAIL).
            Write-Warning "Codex CLI exited with code $LASTEXITCODE."
            if (-not (Test-Path -LiteralPath $reviewPath)) {
              Write-SkipReview "Codex CLI exited with code $LASTEXITCODE before producing a review."
            }
            exit 0   # Not a code quality failure — skip rather than block the pipeline.
          }

          $reviewText = Get-Content -LiteralPath $reviewPath -Raw
          if ($reviewText -notmatch '(?im)^Verdict:\s*(PASS|FAIL|SKIP)\b') {
            throw "Codex CLI review did not include a Verdict: PASS|FAIL|SKIP line."
          }
          $verdict = $Matches[1].ToUpperInvariant()
          if ($verdict -eq 'FAIL') {
            throw "Codex CLI review returned FAIL — see review for details."
          }
          Write-Host "Verdict: $verdict"

      - name: Publish Codex CLI log summary
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          $reviewPath = Join-Path $env:GITHUB_WORKSPACE 'codex_review.md'
          $logPath = Join-Path $env:RUNNER_TEMP 'codex_run.log'
          $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"

          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "## Codex CLI review"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ""
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Run: $runUrl"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Artifact: codex-review-$env:GITHUB_SHA"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ""

          if (Test-Path -LiteralPath $reviewPath) {
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "### Review"
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ""
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value (Get-Content -LiteralPath $reviewPath -Raw)
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ""
          }

          if (Test-Path -LiteralPath $logPath) {
            $lines = Get-Content -LiteralPath $logPath
            $tail = $lines | Select-Object -Last 220
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "### Codex CLI log tail"
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ""
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "Full log is in the uploaded artifact."
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ""
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value '```text'
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $tail
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value '```'
          } else {
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "Codex CLI log was not created."
          }

      - name: Upload review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-review-${{ github.sha }}
          path: |
            codex_review.md
            ${{ runner.temp }}\codex_run.log
            ${{ runner.temp }}\codex-source\diff.patch

      - name: Post review as PR comment
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            // Use absolute path — github-script CWD may differ from GITHUB_WORKSPACE.
            const reviewAbsPath = path.join(process.env.GITHUB_WORKSPACE, 'codex_review.md');
            let review = 'Codex CLI did not produce a review artifact.';
            try { review = fs.readFileSync(reviewAbsPath, 'utf8'); } catch(e) {}
            if (review.length > 45000) {
              review = review.slice(0, 45000) + '\n\n_Review truncated to fit GitHub comment limits._';
            }

            let logTail = 'Codex CLI log was not created.';
            try {
              const logPath = `${process.env.RUNNER_TEMP}\\codex_run.log`;
              const log = fs.readFileSync(logPath, 'utf8');
              logTail = log.split(/\r?\n/).slice(-180).join('\n');
              if (logTail.length > 12000) {
                logTail = logTail.slice(-12000);
              }
            } catch(e) {}

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '### Codex CLI review',
              '',
              `_Branch_: \`${{ github.ref_name }}\` · _Commit_: \`${{ github.sha }}\``,
              `_Run_: ${runUrl}`,
              `_Full log artifact_: \`codex-review-${{ github.sha }}\``,
              '',
              review,
              '',
              '<details>',
              '<summary>Codex CLI log tail</summary>',
              '',
              '```text',
              logTail,
              '```',
              '',
              '</details>'
            ].join('\n');

            const pulls = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${{ github.ref_name }}`,
              state: 'open'
            });
            if (pulls.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pulls.data[0].number,
                body
              });
            }

  # ─── Stage 3: Batch counter — every 5 Codex pushes → trigger QA bump ─────
  batch-counter:
    needs: codex-review
    if: github.actor == 'Sinev-Maksim' && startsWith(github.ref, 'refs/heads/codex/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Count recent reviewed pushes and maybe bump version
        uses: actions/github-script@v7
        with:
          script: |
            // Count commits on codex/* branches in last 24h
            const since = new Date(Date.now() - 86400000).toISOString();
            const branches = await github.rest.repos.listBranches({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            const codexBranches = branches.data
              .filter(b => b.name.startsWith('codex/'));

            let totalCommits = 0;
            for (const b of codexBranches) {
              const commits = await github.rest.repos.listCommits({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: b.name,
                since,
                per_page: 20
              });
              totalCommits += commits.data.length;
            }

            core.info(`Codex commits in last 24h: ${totalCommits}`);
            if (totalCommits > 0 && totalCommits % 5 === 0) {
              core.info('Threshold reached — triggering QA version bump');
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'qa-version-bump.yml',
                ref: 'release/0.32.2-hardening'
              });
            }

  # ─── Stage 4: QA version bump (triggered manually or by batch counter) ────
  # See: .github/workflows/qa-version-bump.yml
