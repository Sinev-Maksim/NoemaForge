name: Autonomous Dev Pipeline

on:
  push:
    branches:
      - 'claude/**'
      - 'codex/**'

jobs:
  # ─── Stage 1: lint + compile on Claude push ───────────────────────────────
  validate-claude-push:
    if: startsWith(github.ref, 'refs/heads/claude/')
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.info.outputs.branch }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install pyyaml --quiet

      - name: Python compile check
        run: |
          find noemaforge/src -name "*.py" | xargs python -m py_compile
          echo "PASS: python compile"

      - name: JSON parse check
        run: |
          find . -name "*.json" \
            ! -path './.git/*' \
            ! -path './noemaforge/src/__pycache__/*' \
            | while read f; do
              python -m json.tool "$f" > /dev/null || exit 1
            done
          echo "PASS: json parse"

      - name: YAML parse check
        run: |
          python - <<'EOF'
          import yaml, pathlib, sys
          files = list(pathlib.Path('.').rglob('*.yaml')) + list(pathlib.Path('.').rglob('*.yml'))
          errors = []
          for f in files:
              if '.git' in str(f): continue
              try: yaml.safe_load(f.read_text())
              except Exception as e: errors.append(f"{f}: {e}")
          if errors:
              print('\n'.join(errors)); sys.exit(1)
          print(f"PASS: yaml parse ({len(files)} files)")
          EOF

      - name: Version check — no forbidden RUNTIME_VERSION assignment
        run: |
          hits=$(grep -rn "RUNTIME_VERSION\s*=" --include="*.py" . \
            | grep -v "noemaforge/src/noemaforge_version.py" \
            | grep -v ".git" || true)
          if [ -n "$hits" ]; then
            echo "FAIL: forbidden RUNTIME_VERSION assignment:"; echo "$hits"; exit 1
          fi
          echo "PASS: no forbidden RUNTIME_VERSION assignment"

      - name: VERSION files = 0.32.2
        run: |
          for f in VERSION noemaforge/VERSION docs/VERSION; do
            if [ -f "$f" ]; then
              v=$(cat "$f" | tr -d '[:space:]')
              if [ "$v" != "0.32.2" ]; then
                echo "FAIL: $f contains '$v', expected 0.32.2"; exit 1
              fi
            fi
          done
          echo "PASS: VERSION files"

      - name: No __pycache__ in git
        run: |
          tracked=$(git ls-files | grep '__pycache__' || true)
          if [ -n "$tracked" ]; then
            echo "FAIL: __pycache__ tracked in git:"; echo "$tracked"; exit 1
          fi
          echo "PASS: no __pycache__ tracked"

      - name: Get branch info
        id: info
        run: echo "branch=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT

  # ─── Stage 2: Codex review (self-hosted Windows Codex CLI) ────────────────
  codex-review:
    needs: validate-claude-push
    runs-on: [self-hosted, Windows, codex]
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get diff vs release branch
        shell: pwsh
        run: |
          git fetch origin release/0.32.2-hardening
          git diff --stat origin/release/0.32.2-hardening...HEAD

      - name: Run Codex CLI review
        id: codex
        shell: pwsh
        env:
          CODEX_HOME: C:\Users\sinev\.codex
          CODEX_BIN_ROOT: C:\Users\sinev\AppData\Local\OpenAI\Codex\bin
        run: |
          $ErrorActionPreference = 'Stop'

          $reviewPath = Join-Path $env:GITHUB_WORKSPACE 'codex_review.md'
          $logPath = Join-Path $env:RUNNER_TEMP 'codex_run.log'
          $codex = $null

          function Write-FailureReview([string] $message) {
            $failureReview = @(
              "Verdict: ERROR"
              ""
              "Summary"
              $message
              ""
              "Blocking Issues"
              "- See the GitHub Actions log artifact for details."
            ) -join [Environment]::NewLine
            Set-Content -LiteralPath $reviewPath -Value $failureReview -Encoding utf8
          }

          $pathCommand = Get-Command codex -ErrorAction SilentlyContinue
          if ($pathCommand) {
            $codex = $pathCommand.Source
          }

          if (-not $codex -and (Test-Path -LiteralPath $env:CODEX_BIN_ROOT)) {
            $codex = Get-ChildItem -LiteralPath $env:CODEX_BIN_ROOT -Filter codex.exe -Recurse -File |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 1 -ExpandProperty FullName
          }

          if (-not $codex -or -not (Test-Path -LiteralPath $codex)) {
            Write-FailureReview "codex.exe was not found on the Windows runner."
            throw "codex.exe was not found. Add Codex CLI to PATH or update CODEX_BIN_ROOT."
          }

          git config --global --add safe.directory $env:GITHUB_WORKSPACE

          $authPath = Join-Path $env:CODEX_HOME 'auth.json'
          if (-not (Test-Path -LiteralPath $authPath)) {
            Write-FailureReview "Codex ChatGPT OAuth auth.json was not found on the Windows runner."
            throw "Codex ChatGPT OAuth auth.json was not found at $authPath."
          }

          & $codex login status
          if ($LASTEXITCODE -ne 0) {
            Write-FailureReview "Codex CLI is not logged in with ChatGPT on the Windows runner."
            throw "Codex CLI is not logged in with ChatGPT. Run codex login for CODEX_HOME=$env:CODEX_HOME."
          }

          $prompt = @(
            "You are reviewing a Claude Code branch in NoemaForge."
            "Base branch: origin/release/0.32.2-hardening"
            "Head branch: $env:GITHUB_REF_NAME"
            "Commit: $env:GITHUB_SHA"
            ""
            "Read .codex/instructions.md and review the diff strictly against the documented gates."
            "Return a concise GitHub-ready Markdown review."
            "Start with exactly one verdict line:"
            "Verdict: PASS"
            "or"
            "Verdict: FAIL"
            ""
            "Include sections for Summary, Blocking Issues, and Optimizations."
            "Do not modify files or push commits in this workflow run."
          ) -join [Environment]::NewLine

          & $codex exec review `
            --base origin/release/0.32.2-hardening `
            --output-last-message $reviewPath `
            $prompt 2>&1 | Tee-Object -FilePath $logPath

          if ($LASTEXITCODE -ne 0) {
            if (-not (Test-Path -LiteralPath $reviewPath)) {
              Write-FailureReview "Codex CLI failed before producing a review."
            }
            throw "Codex CLI review failed with exit code $LASTEXITCODE."
          }

          $reviewText = Get-Content -LiteralPath $reviewPath -Raw
          if ($reviewText -notmatch '(?im)^Verdict:\s*(PASS|FAIL)\b') {
            throw "Codex CLI review did not include a Verdict line."
          }
          if ($Matches[1].ToUpperInvariant() -eq 'FAIL') {
            throw "Codex CLI review returned FAIL."
          }

      - name: Upload review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-review-${{ github.sha }}
          path: |
            codex_review.md
            ${{ runner.temp }}\codex_run.log

      - name: Post review as PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let review = 'Codex CLI did not produce a review artifact.';
            try { review = fs.readFileSync('codex_review.md', 'utf8'); } catch(e) {}
            if (review.length > 60000) {
              review = review.slice(0, 60000) + '\n\n_Review truncated to fit GitHub comment limits._';
            }

            const body = [
              '### Codex CLI review',
              '',
              `_Branch_: \`${{ github.ref_name }}\` · _Commit_: \`${{ github.sha }}\``,
              '',
              review
            ].join('\n');

            const pulls = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${{ github.ref_name }}`,
              state: 'open'
            });
            if (pulls.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pulls.data[0].number,
                body
              });
            }

  # ─── Stage 3: Batch counter — every 5 Codex pushes → trigger QA bump ─────
  batch-counter:
    needs: codex-review
    if: startsWith(github.ref, 'refs/heads/codex/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Count recent reviewed pushes and maybe bump version
        uses: actions/github-script@v7
        with:
          script: |
            // Count commits on codex/* branches in last 24h
            const since = new Date(Date.now() - 86400000).toISOString();
            const branches = await github.rest.repos.listBranches({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            const codexBranches = branches.data
              .filter(b => b.name.startsWith('codex/'));

            let totalCommits = 0;
            for (const b of codexBranches) {
              const commits = await github.rest.repos.listCommits({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: b.name,
                since,
                per_page: 20
              });
              totalCommits += commits.data.length;
            }

            core.info(`Codex commits in last 24h: ${totalCommits}`);
            if (totalCommits > 0 && totalCommits % 5 === 0) {
              core.info('Threshold reached — triggering QA version bump');
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'qa-version-bump.yml',
                ref: 'release/0.32.2-hardening'
              });
            }

  # ─── Stage 4: QA version bump (triggered manually or by batch counter) ────
  # See: .github/workflows/qa-version-bump.yml
