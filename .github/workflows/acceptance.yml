name: acceptance

# === NoemaForge File Header ===
# File: .github/workflows/acceptance.yml
# Zone: ci/acceptance
# Version: 0.33.0
# Purpose: Artifact-driven acceptance suite (AAT). Runs the acceptance harness,
#   publishes the results/ outputs bundle as a workflow artifact, and attests
#   build provenance over the bundle digest. PR-level integrity tier today;
#   safety/toolproxy/epoch/telemetry/release tiers land in later slices.
# Notes: Code comments are English-only. Read-only checks; no auto-commit/push.
# === End NoemaForge File Header ===

on:
  workflow_dispatch:
  push:
    branches:
      - 'claude/aat-**'
      - 'release/**'
  pull_request:
    branches:
      - release/0.33.0-dev
      - release/0.32.2-hardening
      - main

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  aat:
    name: Acceptance suite (artifact-driven)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: pip install pytest --quiet

      - name: Run acceptance harness
        run: bash ci/run_acceptance.sh results

      - name: Pytest acceptance layer
        run: python -m pytest ci/acceptance -q

      - name: Upload acceptance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noemaforge-acceptance-results
          path: results
          retention-days: 90

      - name: Attest acceptance bundle provenance
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: results/manifest.sha256
