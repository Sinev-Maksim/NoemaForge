name: acceptance

# === NoemaForge File Header ===
# File: .github/workflows/acceptance.yml
# Zone: ci/acceptance
# Version: 0.33.0
# Purpose: Artifact-driven acceptance suite (AAT). Runs the acceptance harness,
#   publishes the results/ outputs bundle as a workflow artifact, and attests
#   build provenance over the bundle digest. Gating cases span the integrity,
#   telemetry-privacy, toolproxy (capability tokens + isolation), release-provenance
#   and contract-epoch tiers; boot-dependent safety + LLM cases are target/nightly-only.
# Notes: Code comments are English-only. Read-only checks; no auto-commit/push.
# === End NoemaForge File Header ===

on:
  workflow_dispatch:
  push:
    branches:
      - 'claude/aat-**'
      - 'release/**'
  pull_request:
    branches:
      - release/0.33.0-dev
      - release/0.32.2-hardening
      - main

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  aat:
    name: Acceptance suite (artifact-driven)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install test deps
        run: pip install pytest pyyaml --quiet

      # Release evidence is a PRE-RELEASE concern (owner directive 2026-06-14):
      # it is not generated or checked on PR trees. Only on non-PR events
      # (release/** pushes, dispatch) do we regenerate it so the release-tier
      # checksum_validation AAT case can run; on pull_request the evidence is
      # absent and that case reports "skipped (release-tier)".
      - name: Regenerate evidence (release-tier only)
        if: github.event_name != 'pull_request'
        run: python ci/regen_evidence.py

      - name: Run acceptance harness
        run: bash ci/run_acceptance.sh results

      - name: Pytest acceptance layer
        run: python -m pytest ci/acceptance -q

      - name: Upload acceptance results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: noemaforge-acceptance-results
          path: results
          retention-days: 90

      - name: Attest acceptance bundle provenance
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: results/manifest.sha256
