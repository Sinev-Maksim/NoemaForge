# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow checks out code, performs a Codacy security scan
# and integrates the results with the
# GitHub Advanced Security code scanning feature.  For more information on
# the Codacy security scan action usage and parameters, see
# https://github.com/codacy/codacy-analysis-cli-action.
# For more information on Codacy Analysis CLI in general, see
# https://github.com/codacy/codacy-analysis-cli.

name: Codacy Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "main" ]
  schedule:
    - cron: '16 22 * * 1'

permissions:
  contents: read

jobs:
  codacy-security-scan:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    name: Codacy Security Scan
    runs-on: ubuntu-latest
    # Runaway guard: the full-repo Codacy scan is long-running; cap it so a hung
    # analysis fails fast instead of consuming the default 6h job budget.
    timeout-minutes: 60
    steps:
      # Checkout the repository to the GitHub Actions runner
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # Execute the Codacy Analysis CLI directly via docker, NOT the composite
      # `uses:` action: this repo's Actions policy forbids the action's tag-pinned
      # nested actions (e.g. actions/setup-go@v3, which Codacy controls). A container
      # in a `run:` step is not an Action, so the policy does not gate it. CLI 7.10.1
      # supersedes the action's bundled 4.0.0 (which crashed in postProcess).
      # --max-allowed-issues forces exit 0 so the SARIF is always produced and PR
      # gating is handed to GitHub code-scanning.
      - name: Run Codacy Analysis CLI
        env:
          CODACY_CODE: ${{ github.workspace }}
        run: |
          docker run --rm \
            --env CODACY_CODE="$CODACY_CODE" \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$CODACY_CODE":"$CODACY_CODE" \
            --volume /tmp:/tmp \
            codacy/codacy-analysis-cli:7.10.1 \
            analyze --directory "$CODACY_CODE" \
              --format sarif --output "$CODACY_CODE/results.sarif" \
              --gh-code-scanning-compat \
              --max-allowed-issues 2147483647

      # Upload the SARIF file generated in the previous step
      - name: Upload SARIF results file
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          sarif_file: results.sarif
