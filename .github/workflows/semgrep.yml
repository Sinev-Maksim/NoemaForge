name: Semgrep CE

on:
  pull_request:
    branches:
      - main
      - release/0.33.0-dev
  push:
    branches:
      - main
      - release/0.33.0-dev
  schedule:
    - cron: "23 4 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Semgrep CE SARIF
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: semgrep/semgrep:1.166.0@sha256:c180f0c93a17b420c0af5006214a29d3c747c5459c732b740191adf657dd0068
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Keep rule selection reproducible without contacting the Semgrep Registry.
      - name: Checkout Semgrep CE rules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: semgrep/semgrep-rules
          ref: d41fb34cf74466e2878af5f268ebf54466a04541
          path: .semgrep-rules
          persist-credentials: false

      # Scan only source languages present in the repository with pinned local rules.
      - name: Run Semgrep CE
        run: >-
          semgrep scan
          --config .semgrep-rules/python
          --config .semgrep-rules/javascript
          --config .semgrep-rules/typescript
          --config .semgrep-rules/go
          --exclude .semgrep-rules
          --exclude-rule semgrep-rules.python.lang.security.audit.dangerous-subprocess-use-audit
          --exclude-rule semgrep-rules.python.lang.correctness.common-mistakes.identical-is-comparison
          --exclude-rule semgrep-rules.python.lang.best-practice.arbitrary-sleep
          --exclude-rule semgrep-rules.python.lang.correctness.tempfile.tempfile-without-flush
          --exclude-rule semgrep-rules.python.lang.best-practice.open-never-closed
          --exclude-rule semgrep-rules.javascript.browser.security.insecure-document-method
          --severity ERROR
          --sarif
          --output semgrep.sarif
          --metrics=off
          .

      # Retain the exact SARIF briefly when alert API access is unavailable for triage.
      - name: Upload Semgrep SARIF artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: semgrep-sarif-${{ github.sha }}
          path: semgrep.sarif
          retention-days: 7
          if-no-files-found: error

      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: semgrep.sarif
          category: semgrep-ce
