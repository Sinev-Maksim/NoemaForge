name: Evidence refresh

# Accepted decision A1: PR branches no longer commit regenerated evidence
# (the premerge gate regenerates and verifies in CI). This workflow keeps the
# COMMITTED evidence on release branches current: after every merge/push it
# regenerates the seven generated files and commits the delta, so release
# branches and release archives always carry exact MANIFEST/SHA256SUMS.

on:
  push:
    branches:
      - 'release/**'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: evidence-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    # Skip our own refresh commits to avoid a trigger loop.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Regenerate evidence
        run: python ci/regen_evidence.py

      - name: Verify regenerated evidence
        run: python noemaforge/src/manifest_checksum_exclusion_runtime.py --summary --hash-source git-index > /dev/null

      - name: Commit and push refresh if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "Committed evidence already current."
          else
            git commit -m "chore(evidence): refresh generated manifests/checksums"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
