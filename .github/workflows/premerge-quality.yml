name: Premerge quality gate

# === NoemaForge File Header ===
# File: .github/workflows/premerge-quality.yml
# Zone: release/package
# Version: 0.33.0
# Created: 2026-05-28
# Purpose: Read-only premerge quality gate for PRs targeting the active release branch
#   and main. The expected version is derived from the version source of truth
#   (noemaforge_version.RUNTIME_VERSION), so this gate is version-agnostic and works for
#   0.32.2 and 0.33.0 alike. Fails fast on version violations, compile errors or tracked
#   cache files. No auto-commits, no auto-push, no auto-tagging.
# Notes: Code comments are English-only.
# === End NoemaForge File Header ===

on:
  pull_request:
    branches:
      - release/0.32.2-hardening
      - release/0.33.0-dev
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  quality-gate:
    name: Quality gate (py_compile · JSON · YAML · versions · git hygiene)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install PyYAML
        run: pip install pyyaml --quiet

      # ── 0. Resolve expected version from the source of truth ─────────────
      - name: Resolve expected version from SoT
        run: |
          v=$(python -c "import sys; sys.path.insert(0, 'noemaforge/src'); from noemaforge_version import RUNTIME_VERSION; print(RUNTIME_VERSION)")
          if [ -z "$v" ]; then echo "FAIL: could not resolve RUNTIME_VERSION from SoT"; exit 1; fi
          echo "EXPECTED_VERSION=$v" >> "$GITHUB_ENV"
          echo "Expected version (from noemaforge_version.RUNTIME_VERSION): $v"

      # ── 1. Python compile ────────────────────────────────────────────────
      - name: py_compile noemaforge/src/*.py
        run: |
          count=0; errs=0
          while IFS= read -r -d '' f; do
            python -m py_compile "$f" || { echo "FAIL: $f"; errs=$((errs+1)); }
            count=$((count+1))
          done < <(find noemaforge/src -name "*.py" -print0)
          echo "py_compile: $count files, $errs errors"
          [ "$errs" -eq 0 ] || exit 1

      # ── 2. No RUNTIME_VERSION= assignment outside noemaforge_version.py ──
      - name: No forbidden RUNTIME_VERSION assignment
        run: |
          # Anchor to line-start: avoids matching string literals in test
          # assertIn(f'RUNTIME_VERSION = "..."') calls.
          hits=$(grep -rn "^\s*RUNTIME_VERSION\s*=" --include="*.py" noemaforge/src/ \
            | grep -v "noemaforge/src/noemaforge_version.py" \
            | grep -v "import RUNTIME_VERSION" || true)
          if [ -n "$hits" ]; then
            echo "FAIL: forbidden RUNTIME_VERSION= assignment found:"
            echo "$hits"
            exit 1
          fi
          echo "PASS: no forbidden RUNTIME_VERSION assignment"

      # ── 3. VERSION files = SoT version ───────────────────────────────────
      - name: VERSION files equal SoT version
        run: |
          expected="$EXPECTED_VERSION"
          failed=0
          for f in VERSION noemaforge/VERSION docs/VERSION; do
            if [ -f "$f" ]; then
              v=$(tr -d '[:space:]' < "$f")
              if [ "$v" != "$expected" ]; then
                echo "FAIL: $f = '$v' (expected $expected)"
                failed=$((failed+1))
              else
                echo "PASS: $f = $v"
              fi
            else
              echo "WARN: $f not found"
            fi
          done
          [ "$failed" -eq 0 ] || exit 1

      # ── 4. docs/release.json active fields = SoT version ─────────────────
      - name: docs/release.json version fields equal SoT version
        run: |
          python - <<'PYEOF'
          import json, os, sys
          p = "docs/release.json"
          try:
              d = json.loads(open(p, encoding="utf-8").read())
          except Exception as e:
              print(f"FAIL: cannot parse {p}: {e}"); sys.exit(1)
          expected = os.environ["EXPECTED_VERSION"]
          failed = []
          for field in ("version", "release"):
              if d.get(field) != expected:
                  failed.append(f"{field}={d.get(field)!r} (expected {expected!r})")
          if d.get("release_name", "") not in (f"NoemaForge {expected}", f"NoemaForge {expected} — orchestration hardening and version centralization"):
              if expected not in str(d.get("release_name", "")):
                  failed.append(f"release_name={d.get('release_name')!r} does not contain {expected!r}")
          if expected not in str(d.get("package", "")):
              failed.append(f"package={d.get('package')!r} does not contain {expected!r}")
          if d.get("status") == "pre-alpha" or d.get("channel") == "pre-alpha":
              failed.append(f"stale pre-alpha status={d.get('status')!r} channel={d.get('channel')!r}")
          if failed:
              print("FAIL docs/release.json:"); print("\n".join(f"  {x}" for x in failed)); sys.exit(1)
          print(f"PASS: docs/release.json fields OK (version={d['version']} release={d['release']})")
          PYEOF

      # ── 5. JSON parse — noemaforge/configs/*.json ─────────────────────────
      - name: JSON parse noemaforge/configs/*.json
        run: |
          errs=0; count=0
          while IFS= read -r -d '' f; do
            python -m json.tool "$f" > /dev/null 2>&1 || { echo "FAIL: $f"; errs=$((errs+1)); }
            count=$((count+1))
          done < <(find noemaforge/configs -name "*.json" -print0 2>/dev/null || true)
          echo "JSON parse: $count files, $errs errors"
          [ "$errs" -eq 0 ] || exit 1

      # ── 6. YAML parse — noemaforge/configs/*.yaml ─────────────────────────
      - name: YAML parse noemaforge/configs/*.yaml
        run: |
          python - <<'PYEOF'
          import yaml, pathlib, sys
          configs = pathlib.Path("noemaforge/configs")
          if not configs.exists():
              print("WARN: noemaforge/configs not found, skipping"); sys.exit(0)
          files = list(configs.glob("*.yaml")) + list(configs.glob("*.yml"))
          errs = []
          for f in files:
              try:
                  yaml.safe_load(f.read_text(encoding="utf-8"))
              except Exception as e:
                  errs.append(f"{f}: {e}")
          print(f"YAML parse: {len(files)} files, {len(errs)} errors")
          if errs:
              print("\n".join(errs)); sys.exit(1)
          PYEOF

      # ── 7. No tracked __pycache__ or *.pyc ────────────────────────────────
      - name: No tracked __pycache__ or *.py[co] in git
        run: |
          tracked=$(git ls-files | grep -E '(__pycache__|\.pyc$|\.pyo$)' || true)
          if [ -n "$tracked" ]; then
            echo "FAIL: cached bytecode tracked in git:"
            echo "$tracked"
            exit 1
          fi
          echo "PASS: no tracked __pycache__ or *.py[co]"

      # ── 8. (removed) Release manifest/checksum evidence ──────────────────
      # Release evidence (MANIFEST/SHA256SUMS) is a PRE-RELEASE concern only:
      # it is not tracked, not regenerated and not verified on dev/PR branches
      # (owner directive 2026-06-14). The evidence is generated and verified
      # solely at release time by publish-evidence.yml (tag/dispatch), which
      # assembles it into the signed release bundle. This removes the recurring
      # cross-PR checksum churn entirely.

      # ── 9. Shell syntax check (bash -n) ───────────────────────────────────
      - name: Shell syntax check (bash -n) on .sh files
        run: |
          errs=0; count=0
          while IFS= read -r -d '' f; do
            bash -n "$f" 2>&1 || { echo "FAIL: $f"; errs=$((errs+1)); }
            count=$((count+1))
          done < <(find . -name "*.sh" ! -path './.git/*' -print0)
          echo "bash -n: $count files, $errs syntax errors"
          [ "$errs" -eq 0 ] || exit 1

      # ── 10. Wiki integrity (links · hub index · no dumps) ────────────────
      - name: Wiki integrity (links, hub index, no consolidated dumps)
        run: python ci/wiki_check.py

      # ── 11. Docs hygiene (markdown layout · forbidden text · canon files) ─
      - name: Docs hygiene gate
        run: python noemaforge/src/docs_hygiene_runtime.py --project-root .

      # ── Summary ───────────────────────────────────────────────────────────
      - name: Summary
        run: echo "All premerge quality gates passed."
