  - id
  - target
  - staged_rollout
  - candidate_bundle
  - previous_bundle
  - rollback
  - health_gate
  - refs
targets:
  - model
  - container
  - gateway
stages:
  - shadow
  - canary
  - stable
health_gate_checks:
  - health
  - ready
  - metrics
